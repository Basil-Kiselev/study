syntax = "proto3";

package account;

import "account/account_model.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "pagination/pagination.proto";

option go_package = "study/contracts/account;account";

service Account {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/account/api/v1/create_user"
      body: "*"
    };
  }
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {get: "/account/api/v1/users/{user_id}"};
  }
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse) {
    option (google.api.http) = {get: "/account/api/v1/users"};
  }
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/account/api/v1/users/{user_id}"};
  }
  rpc UpdateUser(UpdateUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/account/api/v1/users/{user_id}"
      body: "*"
    };
  }

  rpc Deposit(DepositRequest) returns (DepositResponse);
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);
  rpc Transfer(TransferRequest) returns (TransferResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
}

message CreateUserRequest {
  CreateUser user = 1;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  uint64 user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetUsersRequest {
  pagination.Pagination pagination = 1;
}

message GetUsersResponse {
  repeated User users = 1;
  pagination.Pagination pagination = 2;
}

message DeleteUserRequest {
  uint64 user_id = 1;
}

message UpdateUserRequest {
  uint64 user_id = 1;
  User user = 2;
}

message DepositRequest {
  uint64 user_id = 1;
  int64 amount = 2;
  uint64 operation_id = 3;
}

message DepositResponse {
  string status = 1;
  int64 balance = 2;
}

message WithdrawRequest {
  uint64 user_id = 1;
  int64 amount = 2;
  uint64 operation_id = 3;
}

message WithdrawResponse {
  string status = 1;
  int64 balance = 2;
}

message TransferRequest {
  uint64 user_id = 1;
  uint64 recipient_id = 2;
  int64 amount = 3;
  uint64 operation_id = 4;
}

message TransferResponse {
  string status = 1;
  int64 user_balance = 2;
  int64 repicient_balance = 3;
}

message GetBalanceRequest {
  uint64 user_id = 1;
}

message GetBalanceResponse {
  int64 balance = 1;
}
