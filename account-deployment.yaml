apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: account
  name: account
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: account
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: account
    spec:
      containers:
        - env:
            - name: DB_DSN
              value: postgres://postgres:postgres@account-db:5432/account?sslmode=disable
            - name: HTTP_HOST
              value: 0.0.0.0
            - name: HTTP_PORT
              value: "8080"
            - name: KAFKA_BROKER_HOST
              value: kafka:9092
            - name: KAFKA_CINSUMER_GROUP
              value: consumer-account
            - name: KAFKA_TRANSACTION_TOPIC
              value: transaction_request
          image: basilientos/account:latest
          name: account
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
