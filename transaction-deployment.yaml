apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: transaction
  name: transaction
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: transaction
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: transaction
    spec:
      containers:
        - env:
            - name: ACCOUNT_GRPC_HOST
              value: account:8080
            - name: DB_DSN
              value: postgres://postgres:postgres@transaction-db:5432/transaction?sslmode=disable
            - name: GRPC_HOST
              value: 0.0.0.0
            - name: GRPC_PORT
              value: "8080"
            - name: KAFKA_BROKER_HOST
              value: kafka:9092
            - name: KAFKA_CINSUMER_GROUP
              value: consumer
            - name: KAFKA_TRANSACTION_TOPIC
              value: transaction_response
          image: basilientos/transaction:latest
          name: transaction
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
