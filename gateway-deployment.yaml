apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: gateway
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: gateway
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: gateway
    spec:
      containers:
        - env:
            - name: ACCOUNT_GRPC_HOST
              value: account:8080
            - name: AUTH_GRPC_HOST
              value: auth:8080
            - name: GRPC_HOST
              value: 0.0.0.0
            - name: GRPC_PORT
              value: "8080"
            - name: JWT_SECRET
              value: secret
            - name: TRANSACTION_GRPC_HOST
              value: transaction:8080
          image: basilientos/gateway:latest
          name: gateway
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
